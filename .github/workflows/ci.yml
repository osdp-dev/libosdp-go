name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # '1.21' is the floor declared in go.mod; 'stable' tracks the latest
        # release so version regressions surface before users hit them.
        go: [ '1.21', 'stable' ]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify vendored C sources match the submodule
        run: |
          go generate .
          # osdp_config.h embeds the submodule's git description; exclude it.
          git diff --exit-code -- . ':(exclude)internal/clib/src/osdp_config.h' || {
            echo "Vendored C sources are stale; run 'go generate .' and commit.";
            exit 1;
          }
      - name: Vet and build
        run: |
          go vet .
          go build .
      - name: Test (race detector)
        run: go test -race -v .
      - name: Build examples
        run: |
          for d in examples/*/ examples/api_showcase/companion_pd/; do
            if ls "$d"*.go >/dev/null 2>&1; then
              (cd "$d" && go build .)
            fi
          done
